[package]
name = "agent-lab-driver-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
process-wrap = { version = "9.1.0", default-features = false, features = ["job-object", "process-group", "std"] }
rmcp = { version = "2.2.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt", "time"] }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos", target_os = "watchos"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[lints]
workspace = true

[[bin]]
name = "agent-lab-driver-fixture"
path = "src/bin/fixture.rs"

[[bin]]
name = "agent-lab-driver-probe"
path = "src/bin/probe.rs"
