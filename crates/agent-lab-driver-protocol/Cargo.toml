[package]
name = "agent-lab-driver-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
process-wrap = { version = "9.1.0", default-features = false, features = ["job-object", "process-group", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
