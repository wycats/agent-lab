[package]
name = "agent-lab-nushell-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nu-ansi-term = "0.50.3"
nu-cmd-lang = { version = "0.114.1", default-features = false }
nu-command = { version = "0.114.1", default-features = false }
nu-engine = { version = "0.114.1", default-features = false }
nu-parser = "0.114.1"
nu-protocol = { version = "0.114.1", default-features = false }
reedline = "0.49.0"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json"] }
rmcp = { version = "2.2.0", default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
signal-hook = "0.3.18"
tokio = { version = "1.49.0", features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }

[dev-dependencies]
expectrl = "0.9.0"

[lints]
workspace = true

[[bin]]
name = "agent-lab-mcp-fixture"
path = "src/bin/fixture.rs"

[[bin]]
name = "agent-lab-nushell-mcp-shell"
path = "src/bin/shell.rs"
