[package]
name = "agent-lab-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
agent-lab-catalog-source = { path = "../agent-lab-catalog-source" }
agent-lab-driver-protocol = { path = "../agent-lab-driver-protocol" }
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.31"
libc = "0.2.183"
portable-pty = "0.9.0"
rand = "0.9.2"
rmcp = { version = "2.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7.18"
toml = "1.0.6"
tower-http = { version = "0.6.8", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt"] }

[lints]
workspace = true
